name: Publish to npm

# Verified community nodes must be published from a GitHub action with a
# provenance statement -- mandatory since 1 May 2026. n8n will not accept a
# package published from a laptop, so this workflow is the only publish path.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx @n8n/scan-community-package n8n-nodes-personyze
        continue-on-error: true
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
